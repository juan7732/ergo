# goreleaser configuration for ergo.
# Docs: https://goreleaser.com
#
# Produces, for each target platform:
#   - a raw binary asset named ergo-<goos>-<goarch> (.exe on Windows), consumed by `ergo update`
#   - an archive: .tar.gz (Unix) / .zip (Windows); the Homebrew formula uses the Unix ones
#   - a single checksums.txt covering every asset, verified by `ergo update`
# and publishes a GitHub release, a formula commit to juan7732/homebrew-tap, and
# a winget manifest pull request to microsoft/winget-pkgs (via the juan7732 fork).
version: 2

project_name: ergo

before:
  hooks:
    - go mod tidy

builds:
  - id: ergo
    main: .
    binary: ergo
    env:
      - CGO_ENABLED=0
    # Build matrix: {darwin,linux,windows} × {amd64,arm64}.
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Embed the release version via the existing main.version ldflag.
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # Raw per-platform binaries named exactly ergo-<goos>-<goarch> (with a .exe
  # suffix on Windows), matching the asset name `ergo update` derives from
  # runtime.GOOS/runtime.GOARCH.
  - id: binary
    ids: [ergo]
    formats: [binary]
    # goreleaser appends the .exe extension automatically on Windows, yielding
    # ergo-windows-<arch>.exe — matching releaseAssetName() in cmd/update.go.
    name_template: "ergo-{{ .Os }}-{{ .Arch }}"
  # Conventional archives: tarballs on Unix (used by Homebrew), zips on Windows.
  - id: archive
    ids: [ergo]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ergo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Single SHA-256 manifest. The name must stay in sync with github.ChecksumName
# in internal/github/github.go, which `ergo update` downloads and verifies.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: false
  prerelease: auto

# DECISION: ergo ships as a Homebrew *formula* (not a cask) committed to an
# external tap. goreleaser v2 marks `brews` deprecated in favor of
# `homebrew_casks`, but a cask changes the install semantics (Casks/ dir, binary
# stanza, different depends_on handling) away from the formula contract this
# project targets (git as a hard dep, gh/code documented in caveats, a Formula/
# directory in the tap). `brews` remains functional throughout goreleaser v2;
# the release workflow pins `~> v2`. Revisit if/when v2 removes it.
brews:
  - name: ergo
    # Use the archive set for the formula's url/sha256 (goreleaser ignores the
    # Windows zips when generating a formula — Homebrew is macOS/Linux only).
    ids: [archive]
    repository:
      owner: juan7732
      name: homebrew-tap
      branch: main
      # The default GITHUB_TOKEN cannot push to a different repo, so the release
      # workflow supplies a PAT with write access to homebrew-tap.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/juan7732/ergo"
    description: "Multi-repo VS Code workspace manager"
    license: "MIT"
    # Runtime dependency: ergo shells out to git for clone/pull/status/run.
    # `gh` (ergo update) and the `code` CLI (ergo open/edit) are optional and
    # only needed by specific commands — see caveats rather than hard-depending.
    dependencies:
      - name: git
    install: |
      bin.install "ergo"
    test: |
      system "#{bin}/ergo", "--version"
    caveats: |
      ergo shells out to a few tools for specific commands:
        • gh   (GitHub CLI) — required by `ergo update`
        • code (VS Code CLI) — required by `ergo open` and `ergo edit`
      Install them if you use those commands:
        brew install gh
        # VS Code: enable the `code` command via "Shell Command: Install 'code' command in PATH"

# DECISION: ergo ships to winget as a *portable* package built from the existing
# Windows zip archives (ids: [archive]). goreleaser emits InstallerType: zip with
# NestedInstallerType: portable and PortableCommandAlias: ergo, so `winget
# install juan7732.ergo` puts an `ergo` command on PATH with no installer
# framework (MSI/NSIS are goreleaser Pro features and would be a second Windows
# artifact to maintain). Nothing existing is renamed: the raw .exe assets stay
# the `ergo update` contract and the zips already exist on every release.
#
# DECISION: the first winget-pkgs pull request is opened by goreleaser on the
# next tag rather than seeded by hand with wingetcreate. The winget-pkgs docs
# accept any of wingetcreate, YAMLCreate, or hand-written manifests for a new
# package (no first-submission tooling rule), goreleaser produces the same
# three-file 1.x manifest set, and a hand-seeded manifest would have to match
# goreleaser's identifier, path, and installer layout exactly or the second
# release would diverge from the first. wingetcreate is also Windows-only.
# Cost of this choice: the first PR needs human moderation (new packages get
# extra scrutiny and can take days); see 08-build-test-release.md.
#
# Prerequisites outside this file: a fork juan7732/winget-pkgs must exist, and
# WINGET_PKGS_TOKEN must be a *classic* PAT with the public_repo scope (a
# fine-grained token cannot open pull requests on repositories outside its
# owner, and microsoft/winget-pkgs is one).
winget:
  - name: ergo
    # Publisher.Package identifier per winget conventions. The GitHub username
    # is the publisher (no organization exists) and the manifests land under
    # manifests/j/juan7732/ergo/<version>/ in winget-pkgs.
    package_identifier: juan7732.ergo
    publisher: juan7732
    publisher_url: "https://github.com/juan7732"
    publisher_support_url: "https://github.com/juan7732/ergo/issues"
    # Only the zip archives: mixing the raw .exe binaries (archive id "binary")
    # in would make goreleaser reject the set as mixed formats.
    ids: [archive]
    homepage: "https://github.com/juan7732/ergo"
    # Metadata follows the README's framing rather than the older "VS Code
    # workspace manager" one-liner still carried by the Homebrew formula.
    short_description: "Agentic context orchestration: git repositories and folders as a declarative context primitive for coding agents and the humans who work with them"
    description: |
      ergo lets you declare which repositories, docs, and working folders make
      up a system, then materializes that declaration into a multi-repo
      workspace: cloned, organized, kept in sync, and readable by both VS Code
      and terminal coding agents. One TOML file is the single source of truth;
      everything on disk is derived from it and can be rebuilt at any time.
      Requires git on PATH; gh (GitHub CLI) for ergo update and the code CLI
      for ergo open and ergo edit are optional.
    license: "MIT"
    license_url: "https://github.com/juan7732/ergo/blob/main/LICENSE"
    release_notes_url: "https://github.com/juan7732/ergo/releases/tag/{{ .Tag }}"
    tags:
      - cli
      - git
      - workspace
      - monorepo
      - multi-repo
      - coding-agents
      - developer-tools
    # Mirrors release.prerelease: auto. A pre-release tag (v1.0.0-rc1) still
    # publishes the GitHub release but must not open a winget-pkgs PR.
    skip_upload: auto
    repository:
      # goreleaser commits the manifests to a branch on the fork, then opens a
      # PR from the fork into microsoft/winget-pkgs. The default GITHUB_TOKEN
      # cannot write to the fork or open that PR, so the release workflow
      # supplies a PAT (same pattern as HOMEBREW_TAP_TOKEN).
      owner: juan7732
      name: winget-pkgs
      branch: "ergo-{{ .Version }}"
      token: "{{ .Env.WINGET_PKGS_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
