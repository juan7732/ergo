name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for changelog/release notes and version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Publishes the release and its assets to juan7732/ergo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to juan7732/homebrew-tap so the brews block can
          # commit the formula to that separate repo (the default GITHUB_TOKEN
          # is scoped to this repo only).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Classic PAT (public_repo scope) that can push a branch to the
          # juan7732/winget-pkgs fork and open the pull request into
          # microsoft/winget-pkgs. Fine-grained tokens cannot open PRs on
          # repositories outside their owner.
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
