name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git describe and release notes

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Build macOS arm64
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build -ldflags "-X main.version=${{ github.ref_name }}" -o ergo-darwin-arm64 .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ergo-darwin-arm64
          generate_release_notes: true
          draft: false
          prerelease: false
